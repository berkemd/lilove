<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#417F4A"/>
      <stop offset="1" stop-color="#224E2D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.60">
      <stop offset="0" stop-color="#63A76B" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#63A76B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="1.05" r="0.9">
      <stop offset="0" stop-color="#153420" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#153420" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#vign)"/>

  <!-- heart blooming from a seedling stem, one silhouette -->
