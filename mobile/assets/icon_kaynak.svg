    C 281 512 386 606 490 660
    C 499 704 494 748 502 792
    Q 512 808 522 792
    C 530 748 525 704 532 661
    C 638 606 743 512 750 398
    C 756 310 694 256 614 268
    C 562 276 526 316 512 372 Z"/>

  <!-- first leaf on the stem -->
  <path fill="#F5F1E4" d="M 506 716
    C 462 714 422 690 410 648
    C 456 640 496 664 508 706 Z"/>

  <!-- seam: the two leaves of the heart part here (tapered lens) -->
  <path fill="#2A5A35" d="M 512 396
    C 503 468 503 542 512 614
    C 521 542 521 468 512 396 Z"/>
</g>
</svg>
